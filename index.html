<title>GUMYR — Ұлттық мәсі</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GUMIR.KZ шеберханасы — қолдан тігілген ұлттық мәсі, 15 жылдық тәжірибе.">
<link rel="icon" href="assets/images/brand/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,600&family=Noto+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============ TOKENS ============ */
  :root{
    --paper:#faf5ea;
    --paper-alt:#f0e3cd;
    --card:#fffdf8;
    --ink:#241811;
    --ink-soft:#6b5646;
    --line:#e4d5bb;
    --leather:#7a4326;
    --leather-2:#5c3319;
    --leather-deep:#20130c;
    --leather-deep-2:#160d08;
    --gold:#c6952f;
    --gold-light:#e9c977;
    --gold-dim:#9c7a3c;
    --burgundy:#7c2634;
    --whatsapp:#25d366;
    --whatsapp-dark:#128c3e;
    --shadow-1: 0 2px 6px rgba(36,24,17,.10), 0 1px 2px rgba(36,24,17,.08);
    --shadow-2: 0 14px 34px -12px rgba(58,32,15,.38), 0 4px 12px -4px rgba(58,32,15,.22);
    --shadow-3: 0 26px 60px -18px rgba(28,16,8,.5), 0 8px 20px -6px rgba(28,16,8,.3);
    --radius-s: 10px;
    --radius-m: 18px;
    --radius-l: 28px;
    --header-h: 78px;
    --font-head: 'Noto Serif', 'Noto Serif SC', serif;
    --font-body: 'Noto Sans', 'Noto Sans SC', sans-serif;
    --ease: cubic-bezier(.16,.84,.44,1);
  }
  html[lang="ar"]{ --font-head:'Cairo',sans-serif; --font-body:'Cairo',sans-serif; }
  html[lang="zh"]{ --font-head:'Noto Serif SC',serif; --font-body:'Noto Sans SC',sans-serif; }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  html,body{ max-width:100%; overflow-x:hidden; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.7;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  html[dir="rtl"] body{ direction:rtl; }
  h1,h2,h3,h4{ font-family:var(--font-head); margin:0; line-height:1.15; letter-spacing:-0.02em; font-weight:600; }
  p{ margin:0; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  ul{ margin:0; padding:0; list-style:none; }
  .container{ width:100%; max-width:1240px; margin-inline:auto; padding-inline:20px; }
  @media(min-width:900px){ .container{ padding-inline:40px; } }

  :focus-visible{ outline:2.5px solid var(--gold); outline-offset:3px; border-radius:4px; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body);
    font-weight:700; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--leather); margin-bottom:14px;
  }
  .eyebrow::before{ content:""; width:22px; height:2px; background:var(--gold); border-radius:2px; }
  .section-title{ font-size:clamp(28px,4.4vw,44px); max-width:16ch; }
  .section-sub{ margin-top:14px; color:var(--ink-soft); max-width:52ch; font-size:16.5px; }
  .section{ padding-block: clamp(56px,9vw,108px); position:relative; }
  .section-head{ margin-bottom:clamp(32px,5vw,56px); }
  .section-head.center{ text-align:center; margin-inline:auto; }
  .section-head.center .section-sub{ margin-inline:auto; }
  .section-head.center .eyebrow::before{ display:none; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    padding:15px 28px; border-radius:999px; font-weight:700; font-size:15px;
    border:1.5px solid transparent; transition:transform .35s var(--ease), box-shadow .35s var(--ease), background-color .3s, border-color .3s, color .3s;
    white-space:nowrap;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(155deg,var(--gold-light),var(--gold) 60%,var(--gold-dim)); color:#2c1c08; box-shadow: 0 10px 24px -8px rgba(198,149,47,.55), 0 2px 6px rgba(198,149,47,.3); }
  .btn-primary:hover{ box-shadow:0 16px 34px -10px rgba(198,149,47,.65), 0 4px 10px rgba(198,149,47,.35); transform:translateY(-2px); }
  .btn-ghost{ background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.35); color:#fff; backdrop-filter:blur(6px); }
  .btn-ghost:hover{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.6); transform:translateY(-2px); }
  .btn-dark{ background:var(--leather-deep); color:#f4e9d8; }
  .btn-dark:hover{ background:var(--leather-2); transform:translateY(-2px); box-shadow:var(--shadow-2); }
  .btn-wa{ background:var(--whatsapp); color:#fff; box-shadow:0 10px 22px -8px rgba(37,211,102,.55); }
  .btn-wa:hover{ background:var(--whatsapp-dark); transform:translateY(-2px); }
  .btn svg{ width:19px; height:19px; flex:none; }

  /* ============ HEADER ============ */
  .header-spacer{ height:var(--header-h); }
  .site-header{
    position:fixed; inset-inline:0; top:0; z-index:900; height:var(--header-h);
    display:flex; align-items:center;
    background:rgba(250,245,234,.82); backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:1px solid rgba(122,67,38,.14);
    transition:box-shadow .3s, background-color .3s;
  }
  .site-header.is-scrolled{ box-shadow:0 8px 24px -12px rgba(36,24,17,.25); }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; }
  .brand{ display:flex; align-items:center; gap:10px; flex:none; }
  .brand img{ height:38px; width:auto; }
  .brand-word{ font-family:var(--font-head); font-weight:700; font-size:19px; letter-spacing:.02em; color:var(--leather-deep); }
  .brand-word small{ display:block; font-family:var(--font-body); font-weight:600; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-dim); }

  .main-nav{ display:none; }
  @media(min-width:1000px){
    .main-nav{ display:flex; align-items:center; gap:2px; }
    .main-nav a{ padding:10px 16px; border-radius:999px; font-weight:600; font-size:14.5px; color:var(--ink-soft); transition:background-color .25s, color .25s; }
    .main-nav a:hover{ background:rgba(122,67,38,.08); color:var(--leather-deep); }
  }
  .header-actions{ display:flex; align-items:center; gap:10px; flex:none; }
  .header-actions .btn-primary{ display:none; padding:12px 22px; font-size:14px; }
  @media(min-width:1000px){ .header-actions .btn-primary{ display:inline-flex; } }

  /* language pill */
  .lang-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    width:46px; height:46px; border-radius:14px; background:rgba(122,67,38,.08); border:1px solid rgba(122,67,38,.16);
    color:var(--leather-deep); transition:background-color .25s, transform .25s; flex:none;
  }
  .lang-btn:hover{ background:rgba(122,67,38,.15); }
  .lang-flag{ width:21px; height:15px; border-radius:3px; overflow:hidden; box-shadow:0 0 0 1px rgba(36,24,17,.18); flex:none; }
  .lang-flag svg{ display:block; width:100%; height:100%; }
  .lang-caret{ width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid currentColor; opacity:.55; }
  .lang-code{ display:none; }

  /* hamburger */
  .burger{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    width:46px; height:46px; border-radius:14px; background:var(--leather-deep); border:none;
    transition:background-color .25s;
  }
  .burger:hover{ background:var(--leather-2); }
  .burger span{ width:20px; height:2px; background:#f4e9d8; border-radius:2px; transition:transform .35s var(--ease), opacity .25s, width .25s; }
  .burger.is-open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .burger.is-open span:nth-child(2){ opacity:0; }
  .burger.is-open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
  @media(min-width:1000px){ .burger{ display:none; } }

  /* mobile nav panel */
  .mobile-nav{
    position:fixed; inset:0; z-index:950; background:var(--leather-deep);
    display:flex; flex-direction:column; padding:22px 22px 34px;
    transform:translateX(100%); transition:transform .45s var(--ease);
    overflow-y:auto;
  }
  html[dir="rtl"] .mobile-nav{ transform:translateX(-100%); }
  .mobile-nav.is-open{ transform:translateX(0); }
  .mobile-nav-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .mobile-nav-close{
    width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    display:flex; align-items:center; justify-content:center; color:#f4e9d8;
  }
  .mobile-nav-close svg{ width:20px; height:20px; }
  .mobile-nav-links{ display:flex; flex-direction:column; margin-top:18px; }
  .mobile-nav-links a{
    padding:16px 4px; font-family:var(--font-head); font-size:24px; color:#f4e9d8; border-bottom:1px solid rgba(255,255,255,.1);
    display:flex; align-items:center; justify-content:space-between;
  }
  .mobile-nav-links a svg{ width:16px; height:16px; opacity:.5; }
  .mobile-nav-cta{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }
  .mobile-nav-foot{ margin-top:auto; padding-top:26px; color:rgba(244,233,216,.55); font-size:13px; }

  /* language sheet */
  .lang-sheet-backdrop{ position:fixed; inset:0; background:rgba(20,12,7,.55); z-index:960; opacity:0; pointer-events:none; transition:opacity .3s; }
  .lang-sheet-backdrop.is-open{ opacity:1; pointer-events:auto; }
  .lang-sheet{
    position:fixed; z-index:970; left:50%; top:50%; transform:translate(-50%,-46%) scale(.96); opacity:0; pointer-events:none;
    width:min(360px,90vw); max-height:80vh; overflow-y:auto; background:var(--card); border-radius:var(--radius-m);
    box-shadow:var(--shadow-3); padding:14px; transition:transform .3s var(--ease), opacity .3s;
  }
  .lang-sheet.is-open{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
  .lang-sheet-title{ font-weight:800; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); padding:10px 12px 6px; }
  .lang-option{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:13px 12px; border-radius:12px; font-weight:600; font-size:15.5px; color:var(--ink); background:none; border:none;
    transition:background-color .2s;
  }
  .lang-option:hover{ background:rgba(122,67,38,.08); }
  .lang-option.is-active{ background:rgba(198,149,47,.16); color:var(--leather-deep); }
  .lang-option .native{ font-family:var(--font-head); }
  .lang-option .check{ width:16px; height:16px; color:var(--gold-dim); opacity:0; }
  .lang-option.is-active .check{ opacity:1; }

  /* ============ HERO ============ */
  #hero{ position:relative; background:var(--leather-deep); color:#fff; overflow:hidden; isolation:isolate; }
  .hero-slides{ position:absolute; inset:0; z-index:0; }
  .hero-slide{
    position:absolute; inset:0; opacity:0; transition:opacity 1.8s ease;
    background-size:cover; background-position:center 30%;
    animation:kenburns 16s ease-in-out infinite;
  }
  .hero-slide.is-active{ opacity:1; z-index:1; }
  @keyframes kenburns{ 0%{ transform:scale(1.06); } 50%{ transform:scale(1.14); } 100%{ transform:scale(1.06); } }
  @media (prefers-reduced-motion:reduce){ .hero-slide{ animation:none; } }
  .hero-scrim{
    position:absolute; inset:0; z-index:2;
    background:
      radial-gradient(120% 90% at 15% 15%, rgba(32,19,12,.35), transparent 55%),
      linear-gradient(200deg, rgba(20,12,7,.55), rgba(20,12,7,.86) 62%, rgba(20,12,7,.96));
  }
  .hero-grain{ position:absolute; inset:0; z-index:3; opacity:.5; mix-blend-mode:overlay; pointer-events:none; }
  .hero-inner{
    position:relative; z-index:4; padding-block:clamp(28px,6vh,56px) 56px;
    min-height: calc(100svh - var(--header-h)); min-height:calc(100vh - var(--header-h));
    display:flex; flex-direction:column; justify-content:flex-start;
  }
  @media(min-height:760px) and (min-width:640px){
    .hero-inner{ justify-content:center; }
  }
  .hero-eyebrow{ display:inline-flex; align-items:center; gap:9px; font-weight:700; font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-light); margin-bottom:22px; }
  .hero-eyebrow::before{ content:""; width:26px; height:2px; background:var(--gold-light); border-radius:2px; }
  .hero-title{ font-size:clamp(40px,7.4vw,84px); color:#fbf3e4; }
  .hero-title em{ font-style:italic; color:var(--gold-light); display:block; }
  .hero-subtitle{ margin-top:26px; max-width:46ch; font-size:clamp(16px,1.7vw,19px); color:rgba(251,243,228,.82); }
  .hero-ctas{ margin-top:38px; display:flex; flex-wrap:wrap; gap:14px; }
  .hero-stats{ margin-top:64px; display:flex; flex-wrap:wrap; gap:clamp(28px,5vw,64px); }
  .hero-stat-value{ font-family:var(--font-head); font-size:clamp(26px,3vw,36px); color:var(--gold-light); }
  .hero-stat-label{ margin-top:4px; font-size:13px; color:rgba(251,243,228,.68); }
  .hero-scrolldown{
    position:absolute; z-index:4; bottom:26px; inset-inline-start:0; width:100%; display:flex; justify-content:center;
    flex-direction:column; align-items:center; gap:8px; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:rgba(251,243,228,.6);
  }
  .hero-scrolldown .line{ width:1px; height:34px; background:linear-gradient(rgba(251,243,228,.8),transparent); animation:scrolldown 2.2s ease-in-out infinite; }
  @keyframes scrolldown{ 0%{ transform:scaleY(.3); transform-origin:top; opacity:.4; } 50%{ transform:scaleY(1); opacity:1; } 100%{ transform:scaleY(.3); transform-origin:bottom; opacity:.4; } }

  /* marquee */
  .marquee-wrap{ background:var(--leather-deep-2); border-block:1px solid rgba(255,255,255,.08); overflow:hidden; position:relative; z-index:5; }
  .marquee-track{ display:flex; width:max-content; gap:0; animation:marquee 32s linear infinite; }
  @media (prefers-reduced-motion:reduce){ .marquee-track{ animation-duration:90s; } }
  .marquee-item{ display:flex; align-items:center; gap:14px; padding:16px 34px; font-family:var(--font-head); font-style:italic; font-size:15px; color:var(--gold-light); white-space:nowrap; }
  .marquee-item::after{ content:"◆"; color:var(--gold-dim); font-size:9px; margin-inline-start:34px; }
  @keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  html[dir="rtl"] .marquee-track{ animation-name:marquee-rtl; }
  @keyframes marquee-rtl{ from{ transform:translateX(0); } to{ transform:translateX(50%); } }

  /* ============ CATEGORY CARDS ============ */
  #categories{ background:var(--paper); }
  .cat-grid{ display:grid; gap:28px; grid-template-columns:1fr; }
  @media(min-width:920px){ .cat-grid{ grid-template-columns:repeat(3,1fr); gap:26px; } }
  .custom-grid{ max-width:980px; margin-inline:auto; }
  @media(min-width:820px){ .custom-grid{ grid-template-columns:1fr 1fr; } }
  .custom-grid .cat-media{ aspect-ratio:3/4; }
  .custom-badge{
    display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
    color:var(--leather); background:linear-gradient(155deg,rgba(233,201,119,.35),rgba(198,149,47,.16)); padding:6px 13px; border-radius:999px; width:fit-content;
  }
  .custom-badge svg{ width:13px; height:13px; }
  .custom-price-note{ font-size:13px; font-style:italic; color:var(--ink-soft); }
  .cat-card{
    background:var(--card); border-radius:var(--radius-l); overflow:hidden; box-shadow:var(--shadow-2);
    border:1px solid rgba(122,67,38,.08); display:flex; flex-direction:column;
  }
  .cat-media{ position:relative; aspect-ratio:4/5; background:#efe4d0; overflow:hidden; touch-action:pan-y; }
  .cat-slide-track{ display:flex; height:100%; transition:transform .5s var(--ease); }
  .cat-slide{ flex:none; width:100%; height:100%; position:relative; }
  .cat-slide img, .cat-slide video{ width:100%; height:100%; object-fit:cover; }
  .cat-slide .vid-badge{ position:absolute; top:14px; inset-inline-start:14px; background:rgba(20,12,7,.65); color:#fff; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:6px 11px; border-radius:999px; display:flex; align-items:center; gap:6px; }
  .cat-media::after{ content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(20,12,7,.42), transparent 42%); pointer-events:none; }
  .cat-arrow{
    position:absolute; top:50%; translate:0 -50%; z-index:6; width:40px; height:40px; border-radius:50%;
    background:rgba(255,253,248,.88); box-shadow:var(--shadow-1); display:flex; align-items:center; justify-content:center; color:var(--leather-deep);
    border:none; transition:background-color .2s, transform .2s;
  }
  .cat-arrow:hover{ background:#fff; transform:translateY(-50%) scale(1.06); }
  .cat-arrow.prev{ inset-inline-start:12px; }
  .cat-arrow.next{ inset-inline-end:12px; }
  .cat-arrow svg{ width:17px; height:17px; }
  html[dir="rtl"] .cat-arrow svg{ transform:scaleX(-1); }
  .cat-dots{ position:absolute; bottom:14px; inset-inline:0; display:flex; justify-content:center; gap:6px; z-index:6; }
  .cat-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); transition:background-color .25s, width .25s; }
  .cat-dot.is-active{ background:#fff; width:18px; border-radius:4px; }
  .cat-body{ padding:24px 24px 26px; display:flex; flex-direction:column; gap:14px; flex:1; }
  .cat-title{ font-size:20px; }
  .cat-desc{ color:var(--ink-soft); font-size:14.5px; line-height:1.65; }
  .cat-price{ font-family:var(--font-head); font-weight:700; font-size:19px; color:var(--leather); }
  .cat-colors-label{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
  .cat-swatches{ display:flex; flex-wrap:wrap; gap:9px; }
  .swatch{
    position:relative; width:30px; height:30px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px rgba(122,67,38,.25);
    transition:transform .2s, box-shadow .2s; flex:none;
    background-size:220% auto; background-position:center 30%; background-repeat:no-repeat; background-color:#eee;
  }
  .swatch:hover{ transform:scale(1.1); }
  .swatch.is-active{ box-shadow:0 0 0 2.5px var(--gold); transform:scale(1.08); }
  .cat-other-colors{ font-size:12.5px; color:var(--ink-soft); font-style:italic; }
  .cat-cta{ margin-top:6px; width:100%; }

  /* ============ ABOUT ============ */
  #about{ background:var(--leather-deep); color:#f4ecdf; position:relative; overflow:hidden; }
  #about::before{ content:""; position:absolute; inset:0; background:radial-gradient(70% 60% at 85% 10%, rgba(198,149,47,.14), transparent 60%); }
  .about-grid{ position:relative; display:grid; gap:44px; grid-template-columns:1fr; align-items:start; }
  @media(min-width:980px){ .about-grid{ grid-template-columns:.85fr 1.15fr; gap:64px; } }
  .about-copy .eyebrow{ color:var(--gold-light); }
  .about-copy .eyebrow::before{ background:var(--gold-light); }
  .about-copy h2{ color:#fbf3e4; font-size:clamp(28px,4vw,42px); }
  .about-copy p{ margin-top:18px; color:rgba(244,236,223,.78); font-size:16px; max-width:48ch; }
  .about-features{ display:grid; gap:18px; grid-template-columns:1fr; }
  @media(min-width:640px){ .about-features{ grid-template-columns:1fr 1fr; } }
  .about-feature{ background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.09); border-radius:var(--radius-m); padding:24px; transition:transform .3s var(--ease), background-color .3s; }
  .about-feature:hover{ transform:translateY(-4px); background:rgba(255,255,255,.075); }
  .about-feature .ic{ width:40px; height:40px; border-radius:12px; background:linear-gradient(155deg,var(--gold-light),var(--gold-dim)); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .about-feature .ic svg{ width:20px; height:20px; color:#2c1c08; }
  .about-feature h4{ color:#fbf3e4; font-size:16.5px; }
  .about-feature p{ margin-top:8px; font-size:13.8px; color:rgba(244,236,223,.66); }

  /* ============ GALLERY (media carousel) ============ */
  #gallery-media{ background:var(--paper-alt); }
  .gcarousel{ position:relative; }
  .gcarousel-track{ display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding-block:6px 10px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .gcarousel-track::-webkit-scrollbar{ display:none; }
